<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel — Dark Pattern Detector</title>
<style>
  :root{--bg:#0a0e14;--panel:#111826;--line:#1f2b3d;--text:#dbe4f0;--dim:#7d8ba3;--amber:#f5a623;--red:#e5484d;--green:#3ecf8e;--mono:'SF Mono',ui-monospace,Consolas,monospace;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:30px 18px 60px;}
  header{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);}
  h1{font-size:1.5rem;margin:0;font-family:var(--mono);letter-spacing:.5px;}
  .sub{color:var(--dim);font-size:.85rem;margin:0 0 26px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;margin-bottom:20px;}
  .panel h2{font-size:.8rem;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:0 0 12px;font-weight:600;}
  textarea{width:100%;min-height:140px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:12px;font-family:var(--mono);font-size:.85rem;resize:vertical;}
  .examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .examples button{background:none;border:1px solid var(--line);color:var(--dim);padding:5px 10px;border-radius:14px;font-size:.75rem;cursor:pointer;}
  .examples button:hover{border-color:var(--amber);color:var(--amber);}
  .actions{display:flex;justify-content:flex-end;margin-top:12px;}
  button.primary{background:var(--amber);color:#1a1300;border:none;padding:11px 22px;border-radius:6px;font-weight:700;cursor:pointer;font-size:.9rem;}
  button.primary:disabled{opacity:.5;cursor:default;}
  .loading{color:var(--dim);font-family:var(--mono);font-size:.8rem;margin-top:10px;display:none;}
  .score-row{display:flex;align-items:center;gap:20px;margin-bottom:16px;}
  .gauge{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:1.3rem;flex-shrink:0;}
  .gauge div{background:var(--panel);width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .verdict{font-family:var(--mono);font-size:.95rem;}
  .verdict .label{color:var(--dim);font-size:.75rem;display:block;margin-bottom:2px;}
  .flag{background:var(--bg);border-left:3px solid var(--red);border-radius:4px;padding:10px 12px;margin-bottom:8px;}
  .flag.medium{border-left-color:var(--amber);}
  .ftype{font-weight:700;font-size:.85rem;margin-bottom:3px;}
  .fdesc{font-size:.82rem;color:var(--dim);}
  .email-box{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;font-family:var(--mono);font-size:.8rem;white-space:pre-wrap;max-height:220px;overflow-y:auto;}
  .copy-btn{background:var(--line);color:var(--text);border:none;padding:7px 14px;border-radius:5px;font-size:.78rem;cursor:pointer;margin-top:8px;}
  .reg-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.85rem;}
  .reg-row:last-child{border-bottom:none;}
  .reg-score{font-family:var(--mono);font-weight:700;padding:2px 9px;border-radius:10px;font-size:.78rem;color:#0a0e14;}
  .empty{color:var(--dim);font-size:.85rem;}
  .err{color:var(--red);font-size:.82rem;margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="dot"></div><h1>SENTINEL</h1></header>
  <p class="sub">Paste text from a checkout page, subscription screen, or terms of service. AI scans it for dark patterns and drafts your way out.</p>

  <div class="panel">
    <h2>Scan text</h2>
    <textarea id="input" placeholder="Paste the pricing page / checkout / T&C text here..."></textarea>
    <div class="examples">
      <button data-ex="trial">Try: fake free trial</button>
      <button data-ex="cancel">Try: hidden cancel flow</button>
    </div>
    <div class="actions"><button class="primary" id="scanBtn">Scan for dark patterns</button></div>
    <div id="loadingMsg" class="loading">Analyzing...</div>
    <div id="errMsg" class="err"></div>
  </div>

  <div class="panel" id="resultPanel" style="display:none;">
    <h2>Result</h2>
    <div class="score-row">
      <div class="gauge" id="gauge"></div>
      <div class="verdict"><span class="label">Dark Pattern Risk Score</span><span id="verdictText"></span></div>
    </div>
    <div id="flagsList"></div>
    <h2 style="margin-top:18px;">Cancellation / dispute email</h2>
    <div class="email-box" id="emailBox"></div>
    <button class="copy-btn" id="copyBtn">Copy email</button>
    <div class="actions" style="margin-top:14px;"><button class="primary" id="reportBtn">Add to public registry</button></div>
  </div>

  <div class="panel">
    <h2>Community registry — recently flagged</h2>
    <div id="registry"><div class="empty">Loading...</div></div>
  </div>
</div>

<script>
const EX = {
  trial: 'Start your FREE 7-day trial! ✓ No commitment. [Start Free Trial] (pre-checked box: "Yes, sign me up for the annual plan at $89.99/year after trial") By continuing you agree that your card will be charged automatically unless you cancel through your account settings at least 48 hours before trial ends. To cancel, go to Settings > Billing > Manage Subscription > Cancel Plan > Confirm > Enter reason > Confirm again.',
  cancel: 'Your subscription will auto-renew on the 14th for $19.99/month. To cancel, please contact support during business hours (Mon-Fri, 9am-5pm) via phone only. Cancellations submitted via email are not accepted. A 30-day notice is required before your next billing cycle.'
};
document.querySelectorAll('.examples button').forEach(b => {
  b.addEventListener('click', () => { document.getElementById('input').value = EX[b.dataset.ex]; });
});

function scoreColor(s){ return s >= 70 ? 'var(--red)' : s >= 40 ? 'var(--amber)' : 'var(--green)'; }
function esc(s){ return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let lastResult = null;

document.getElementById('scanBtn').addEventListener('click', async () => {
  const text = document.getElementById('input').value.trim();
  const errEl = document.getElementById('errMsg');
  const btn = document.getElementById('scanBtn');
  errEl.textContent = '';
  if (!text) { errEl.textContent = 'Paste some text first.'; return; }
  btn.disabled = true;
  document.getElementById('loadingMsg').style.display = 'block';
  document.getElementById('resultPanel').style.display = 'none';
  try {
    const r = await fetch('/api/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Scan failed');
    renderResult(data);
  } catch (e) {
    errEl.textContent = e.message || 'Analysis failed — try again.';
  } finally {
    btn.disabled = false;
    document.getElementById('loadingMsg').style.display = 'none';
  }
});

function renderResult(r) {
  lastResult = r;
  document.getElementById('resultPanel').style.display = 'block';
  const color = scoreColor(r.riskScore);
  const g = document.getElementById('gauge');
  g.style.background = `conic-gradient(${color} ${r.riskScore * 3.6}deg, var(--line) 0deg)`;
  g.innerHTML = `<div>${r.riskScore}</div>`;
  document.getElementById('verdictText').textContent =
    r.riskScore >= 70 ? 'High risk — likely deliberate dark patterns' :
    r.riskScore >= 40 ? 'Medium risk — some manipulative wording' :
    'Low risk — looks relatively clean';
  document.getElementById('flagsList').innerHTML = (r.flags || []).map(f => `
    <div class="flag ${f.severity === 'medium' ? 'medium' : ''}">
      <div class="ftype">${esc(f.type)}</div>
      <div class="fdesc">${esc(f.description)}</div>
    </div>`).join('') || '<div class="empty">No specific patterns flagged.</div>';
  document.getElementById('emailBox').textContent = r.disputeEmail || '';
}

document.getElementById('copyBtn').addEventListener('click', () => {
  if (lastResult) navigator.clipboard.writeText(lastResult.disputeEmail || '');
});

document.getElementById('reportBtn').addEventListener('click', async () => {
  if (!lastResult) return;
  const btn = document.getElementById('reportBtn');
  btn.disabled = true; btn.textContent = 'Adding...';
  try {
    const r = await fetch('/api/registry', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        siteGuess: lastResult.siteGuess,
        riskScore: lastResult.riskScore,
        topFlag: lastResult.flags && lastResult.flags[0] ? lastResult.flags[0].type : 'Dark pattern'
      })
    });
    if (!r.ok) throw new Error();
    btn.textContent = 'Added ✓';
    loadRegistry();
  } catch (e) {
    btn.textContent = 'Could not add';
  }
  setTimeout(() => { btn.disabled = false; btn.textContent = 'Add to public registry'; }, 2000);
});

async function loadRegistry() {
  const el = document.getElementById('registry');
  try {
    const r = await fetch('/api/registry');
    const rows = await r.json();
    if (!r.ok) throw new Error();
    if (!rows.length) { el.innerHTML = '<div class="empty">No reports yet — be the first to add one above.</div>'; return; }
    el.innerHTML = rows.map(v => `
      <div class="reg-row">
        <span>${esc(v.site_guess)} — <span style="color:var(--dim)">${esc(v.top_flag)}</span></span>
        <span class="reg-score" style="background:${scoreColor(v.risk_score)}">${esc(v.risk_score)}</span>
      </div>`).join('');
  } catch (e) {
    el.innerHTML = '<div class="empty">Registry unavailable right now.</div>';
  }
}
loadRegistry();
</script>
</body>
</html>
